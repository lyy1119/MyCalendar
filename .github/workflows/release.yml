name: Release

# Every push to main publishes a release: a git tag, a GitHub release and a
# container image on ghcr.io. The patch number increments itself, computed from
# the tags that already exist, so nobody edits a version file by hand.
#
# How the version moves:
#
#   push to main            patch bump, computed from the existing tags
#   commit message [minor]  minor bump instead of patch
#   commit message [major]  major bump instead of patch
#   commit message [skip release]
#                           publish nothing for that push; the tests still run
#   workflow_dispatch       pick the bump by hand, which wins over the message
#
# A database format change always needs a major bump, so [major] is the usual way
# to cut one without reaching for the Actions UI.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write # push the tag, create the release
  packages: write # push the image to ghcr.io

# Two runs computing a version at the same time would pick the same number, so
# releases queue rather than overlap. Queued, not cancelled: every push deserves
# its release.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # nothing here needs more than that
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Type checks and bundles, which is also what the image build will do.
      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

  version:
    name: Next version
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      image: ${{ steps.next.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags live in history, and a shallow clone has none: the version
          # would then look like a first release on every run.
          fetch-depth: 0

      - name: Compute the next version
        id: next
        env:
          # A manual dispatch names the bump outright; otherwise it comes from
          # the commit message, and failing that it is a patch.
          DISPATCH_BUMP: ${{ inputs.bump }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          bump="$DISPATCH_BUMP"
          if [ -z "$bump" ]; then
            case "$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '\[(major|minor|patch)\]' | head -n 1)" in
              '[major]') bump=major ;;
              '[minor]') bump=minor ;;
              '[patch]') bump=patch ;;
              *)         bump=patch ;;
            esac
            echo "No dispatch input; bump '$bump' taken from the commit message"
          else
            echo "Bump '$bump' taken from the dispatch input"
          fi

          version="$(.github/scripts/next-version.sh "$bump")"
          # ghcr.io refuses uppercase in an image name, and this repository is
          # MyCalendar, so lower-case the whole path.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $version as $image:$version"

  binaries:
    name: Build executables
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Go build embeds the bundle, so it has to exist first. This is the
      # same build the container image performs.
      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO stays off so both targets are self-contained: the SQLite driver is
      # pure Go, and the IANA database is embedded, so the Windows binary needs
      # no DLLs and the Linux one no libc.
      - name: Build linux/amd64 and windows/amd64
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist pkg
          ldflags="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags webui_embedded -trimpath -ldflags "$ldflags" \
            -o pkg/mycalendar ./cmd/mycalendar

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -tags webui_embedded -trimpath -ldflags "$ldflags" \
            -o pkg/mycalendar.exe ./cmd/mycalendar

          # Keep the executable bit on the Linux side by archiving it; a bare
          # download would land without it.
          tar -C pkg -czf "dist/mycalendar-${VERSION}-linux-amd64.tar.gz" mycalendar
          (cd pkg && zip -q "../dist/mycalendar-${VERSION}-windows-amd64.zip" mycalendar.exe)

          # Fail loudly rather than shipping a truncated download.
          test -s "dist/mycalendar-${VERSION}-linux-amd64.tar.gz"
          test -s "dist/mycalendar-${VERSION}-windows-amd64.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish image and release
    runs-on: ubuntu-latest
    needs: [version, binaries]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Attached to the release below, so a release always carries the same
      # executables the image was built from.
      - uses: actions/download-artifact@v4
        with:
          name: executables
          path: dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.version.outputs.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Only amd64 is built. Add linux/arm64 to this list to cover a
          # Raspberry Pi or an arm NAS; it works, it just doubles the build time
          # because the Go compile then runs under emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # Re-running the workflow must not fail on work already done.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, leaving it alone"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          # The previous release, with this tag itself excluded, so the notes
          # list what changed rather than everything that ever happened.
          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -n 1 || true)"

          {
            echo "容器镜像：\`${IMAGE}:${VERSION}\`"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "免安装可执行文件（下载后直接运行，已内嵌前端与 SQLite）："
            echo
            echo "- \`mycalendar-${VERSION}-linux-amd64.tar.gz\`"
            echo "- \`mycalendar-${VERSION}-windows-amd64.zip\`"
            echo
            echo "用法与 \`MYCAL_*\` 环境变量见 README 的「直接运行二进制」一节。"
            echo
            if [ -n "$previous" ]; then
              echo "自 ${previous} 以来的改动："
              echo
              git log --no-merges --pretty='- %s (%h)' "${previous}..${TAG}"
            else
              echo "首个发布。"
            fi
          } > /tmp/notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running must not fail, and must still end with the assets in
            # place, so upload over whatever is already attached.
            echo "Release $TAG already exists; refreshing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md dist/*
          fi
